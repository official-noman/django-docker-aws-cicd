name: CI Pipeline — Inventory SaaS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_inventory
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      DB_NAME: test_inventory
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: app.settings.local
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run linting (flake8)
        working-directory: backend
        run: |
          flake8 \
            --max-line-length=120 \
            --exclude=migrations,__pycache__,.git,htmlcov \
            inventory/ app/ stores/

      - name: Run database migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest \
            --cov=inventory \
            --cov=stores \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build ./backend -t inventory-saas:${{ github.sha }}

      - name: Verify image starts
        run: |
          docker run --rm \
            -e SECRET_KEY=ci-placeholder \
            -e DJANGO_SETTINGS_MODULE=app.settings.production \
            inventory-saas:${{ github.sha }} \
            python manage.py check --deploy 2>&1 | grep -v "WARNINGS" || true