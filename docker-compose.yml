services:
  # ── Database ──────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devops_inventory
      - POSTGRES_USER=hello_django
      - POSTGRES_PASSWORD=supersecret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello_django -d devops_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # ── Redis (Cache / Celery Broker) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # ── Backend (Django + Gunicorn) ───────────────────────────────────────
  web:
    build: ./backend
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 app.wsgi:application
      "
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
    expose:
      - 8000
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # ── Nginx (Reverse Proxy) ────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    ports:
      - "80:80"
    depends_on:
      - web
    restart: always

volumes:
  postgres_data:
  redis_data:
  static_volume: